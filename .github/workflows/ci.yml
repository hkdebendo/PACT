name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # CI never has credentials: PayPal runs SIMULATED and Muse runs from the recorded replay cache.
      PAYPAL_ENV: simulated
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secret-scan -- --all
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @pact/web
